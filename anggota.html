<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Anggota - Perpustakaan SLBN Tompokersan Lumajang</title>
<link rel="icon" href="assets/favicon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell" id="app-shell"></div>

<template id="anggotaTemplate">
  <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
    <div class="input-group" style="max-width: 320px;">
      <span class="input-group-text bg-transparent"><i class="bi bi-search"></i></span>
      <input type="text" class="form-control" id="searchAnggota" placeholder="Cari nama atau ID anggota...">
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-secondary" id="btnCetakSemuaKartu"><i class="bi bi-printer"></i> Cetak Semua Kartu</button>
      <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#modalAnggota" id="btnTambahAnggota">
        <i class="bi bi-plus-lg"></i> Tambah Anggota
      </button>
    </div>
  </div>

  <div class="table-card">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th>ID Anggota</th><th>Nama</th><th>Jenis</th><th>Kelas</th><th class="text-end">Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelAnggota"></tbody>
      </table>
    </div>
    <div class="empty-state d-none" id="emptyAnggota">
      <i class="bi bi-people"></i>
      Belum ada data anggota. Klik "Tambah Anggota" untuk mulai.
    </div>
  </div>
</template>

<!-- Modal Tambah/Edit Anggota -->
<div class="modal fade" id="modalAnggota" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="formAnggota">
        <div class="modal-header">
          <h5 class="modal-title" id="modalAnggotaTitle">Tambah Anggota</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="anggotaDocId">
          <div class="mb-3">
            <label class="form-label">ID Anggota</label>
            <input type="text" class="form-control" id="anggotaId" placeholder="Contoh: SW-2026-001" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Nama Lengkap</label>
            <input type="text" class="form-control" id="anggotaNama" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Jenis Anggota</label>
            <select class="form-select" id="anggotaJenis" required>
              <option value="Siswa">Siswa</option>
              <option value="Guru">Guru</option>
            </select>
          </div>
          <div class="mb-3" id="wrapperKelas">
            <label class="form-label">Kelas</label>
            <input type="text" class="form-control" id="anggotaKelas" placeholder="Contoh: VII-B">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="submit" class="btn btn-brand">Simpan</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal Kartu Anggota -->
<div class="modal fade" id="modalKartu" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Kartu Anggota</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        <div id="kartuPreview" class="d-inline-block"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Tutup</button>
        <button type="button" class="btn btn-brand" id="btnCetakKartuTunggal"><i class="bi bi-printer"></i> Cetak</button>
      </div>
    </div>
  </div>
</div>

<!-- Area cetak (disembunyikan, dipakai saat window.print()) -->
<div class="print-area" id="printArea"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="js/firebase.js"></script>
<script src="js/common.js"></script>
<script src="js/anggota.js"></script>
<script>
  requireAuth(() => {
    renderShell("Data Anggota");
    document.getElementById("pageContent").innerHTML = document.getElementById("anggotaTemplate").innerHTML;
    initAnggotaPage();
  });
</script>
</body>
</html>
