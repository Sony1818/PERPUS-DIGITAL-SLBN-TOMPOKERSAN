<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengembalian - Perpustakaan SLBN Tompokersan Lumajang</title>
<link rel="icon" href="assets/favicon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell" id="app-shell"></div>

<template id="pengembalianTemplate">
  <div class="row g-3">
    <div class="col-lg-5">
      <div class="card-soft p-3 mb-3">
        <h2 class="h6 mb-3"><i class="bi bi-camera"></i> Kamera Pemindai</h2>
        <div id="reader"></div>
        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-outline-secondary btn-sm flex-fill" id="btnGantiKamera"><i class="bi bi-arrow-repeat"></i> Ganti Kamera</button>
          <button class="btn btn-outline-secondary btn-sm flex-fill" id="btnInputManual"><i class="bi bi-keyboard"></i> Input Manual</button>
        </div>
        <div class="mt-2 d-none" id="wrapperManual">
          <div class="input-group input-group-sm">
            <input type="text" class="form-control" id="inputManual" placeholder="Ketik ID anggota / buku lalu Enter">
            <button class="btn btn-brand" id="btnKirimManual">Kirim</button>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="scan-step mb-3" id="stepAnggota">
        <h3 class="h6"><i class="bi bi-person-check"></i> Langkah 1 — Scan Kartu Anggota</h3>
        <div id="infoAnggota" class="text-muted-soft small">Arahkan kamera ke kartu anggota yang mengembalikan buku.</div>
      </div>

      <div class="scan-step mb-3" id="stepBuku">
        <h3 class="h6"><i class="bi bi-book"></i> Langkah 2 — Scan Buku yang Dikembalikan</h3>
        <div id="infoBuku" class="text-muted-soft small">Menunggu anggota terverifikasi...</div>
      </div>

      <div class="card-soft p-3 mb-3 d-none" id="wrapperJumlahKembali">
        <label class="form-label mb-1">Jumlah Buku Dikembalikan</label>
        <div class="input-group" style="max-width: 200px;">
          <button class="btn btn-outline-secondary" type="button" id="btnKurangiJumlahKembali">-</button>
          <input type="number" class="form-control text-center" id="inputJumlahKembali" value="1" min="1">
          <button class="btn btn-outline-secondary" type="button" id="btnTambahJumlahKembali">+</button>
        </div>
        <div class="form-text" id="keteranganJumlahKembali"></div>
      </div>

      <div class="alert alert-warning d-none" id="alertTerlambat"></div>

      <button class="btn btn-brand btn-lg w-100" id="btnKembalikanBuku" disabled>
        <i class="bi bi-box-arrow-in-left"></i> Kembalikan Buku
      </button>

      <button class="btn btn-outline-secondary w-100 mt-2" id="btnResetScan">
        <i class="bi bi-arrow-counterclockwise"></i> Mulai Scan Baru
      </button>
    </div>
  </div>
</template>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="js/firebase.js"></script>
<script src="js/common.js"></script>
<script src="js/pengembalian.js"></script>
<script>
  requireAuth(() => {
    renderShell("Pengembalian Buku");
    document.getElementById("pageContent").innerHTML = document.getElementById("pengembalianTemplate").innerHTML;
    initPengembalianPage();
  });
</script>
</body>
</html>
