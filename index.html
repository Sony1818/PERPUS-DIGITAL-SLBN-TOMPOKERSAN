<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Perpustakaan SLB Negeri Tompokersan Lumajang</title>
<link rel="icon" href="assets/favicon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo"><img src="assets/logo-sekolah.png" alt="Logo SLBN Tompokersan Lumajang"></div>
    <h1 class="text-center h4 mb-1">Perpustakaan SLB Negeri Tompokersan Lumajang</h1>
    <p class="text-center text-muted-soft mb-4">Masuk untuk mengelola peminjaman &amp; pengembalian buku</p>

    <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="petugas@sekolah.sch.id" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Kata Sandi</label>
        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-brand w-100 py-2" id="loginBtn">
        <span class="spinner-border spinner-border-sm d-none" id="loginSpinner"></span>
        Masuk
      </button>
    </form>

    <p class="text-center text-muted-soft small mt-4 mb-0">
      Akun hanya dibuat oleh admin melalui Firebase Console &gt; Authentication.
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
<script>
  // Jika sudah login, langsung ke dashboard
  auth.onAuthStateChanged((user) => {
    if (user) window.location.href = "dashboard.html";
  });

  document.getElementById("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const alertBox = document.getElementById("loginAlert");
    const btn = document.getElementById("loginBtn");
    const spinner = document.getElementById("loginSpinner");

    alertBox.classList.add("d-none");
    btn.disabled = true;
    spinner.classList.remove("d-none");

    auth.signInWithEmailAndPassword(email, password)
      .then(() => { window.location.href = "dashboard.html"; })
      .catch((err) => {
        let msg = "Email atau kata sandi salah.";
        if (err.code === "auth/too-many-requests") msg = "Terlalu banyak percobaan. Coba lagi nanti.";
        if (err.code === "auth/invalid-email") msg = "Format email tidak valid.";
        alertBox.textContent = msg;
        alertBox.classList.remove("d-none");
      })
      .finally(() => {
        btn.disabled = false;
        spinner.classList.add("d-none");
      });
  });
</script>
</body>
</html>
