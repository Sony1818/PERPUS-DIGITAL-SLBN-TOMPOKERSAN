<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riwayat Peminjaman - Perpustakaan SLBN Tompokersan Lumajang</title>
<link rel="icon" href="assets/favicon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell" id="app-shell"></div>

<template id="riwayatTemplate">
  <div class="card-soft p-3 mb-3">
    <div class="row g-2 align-items-end">
      <div class="col-6 col-md-3">
        <label class="form-label">Cari Nama</label>
        <input type="text" class="form-control" id="filterNama" placeholder="Nama anggota...">
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label">Jenis</label>
        <select class="form-select" id="filterJenis">
          <option value="">Semua</option>
          <option value="Guru">Guru</option>
          <option value="Siswa">Siswa</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label">Kelas</label>
        <input type="text" class="form-control" id="filterKelas" placeholder="Contoh: VII-B">
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label">Status</label>
        <select class="form-select" id="filterStatus">
          <option value="">Semua</option>
          <option value="Dipinjam">Dipinjam</option>
          <option value="Dikembalikan">Dikembalikan</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label">Dari Tanggal</label>
        <input type="date" class="form-control" id="filterDariTanggal">
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label">Sampai Tanggal</label>
        <input type="date" class="form-control" id="filterSampaiTanggal">
      </div>
      <div class="col-12 col-md-1 d-grid">
        <button class="btn btn-outline-secondary" id="btnResetFilter" title="Reset Filter"><i class="bi bi-x-circle"></i></button>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-2">
    <span class="text-muted-soft small" id="jumlahHasil">0 data ditemukan</span>
    <button class="btn btn-brand" id="btnExportExcel"><i class="bi bi-file-earmark-excel"></i> Export ke Excel</button>
  </div>

  <div class="table-card">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th>Nama Anggota</th><th>ID Anggota</th><th>Judul Buku</th><th>ID Buku</th>
            <th>Tgl Pinjam</th><th>Tgl Kembali</th><th>Status</th>
          </tr>
        </thead>
        <tbody id="tabelRiwayat"></tbody>
      </table>
    </div>
    <div class="empty-state d-none" id="emptyRiwayat">
      <i class="bi bi-clock-history"></i>
      Tidak ada riwayat yang cocok dengan filter.
    </div>
  </div>
</template>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/firebase.js"></script>
<script src="js/common.js"></script>
<script src="js/riwayat.js"></script>
<script>
  requireAuth(() => {
    renderShell("Riwayat Peminjaman");
    document.getElementById("pageContent").innerHTML = document.getElementById("riwayatTemplate").innerHTML;
    initRiwayatPage();
  });
</script>
</body>
</html>
